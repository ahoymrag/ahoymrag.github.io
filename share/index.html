<!DOCTYPE html>
<html lang="en" x-data="portfolioPage()">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>My Shared Portfolio</title>
    <!-- Minimal Inline Styling for Demo Purposes -->
    <style>
      * {
        font-family: 'Montserrat', sans-serif; /* Updated font */
      }
      body {
        font-family: 'Montserrat', sans-serif; /* Updated font */
        margin: 0; padding: 0;
        background: #f9f9f9; 
        color: #333;
      }
      header {
        background: #fff;
        padding: 1rem;
        box-shadow: 0 0 6px rgba(0,0,0,0.1);
        text-align: center;
      }
      h1 { margin: 0; }
      .filter-buttons {
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center;
        gap: 0.5rem; 
        margin: 1rem 0;
      }
      .filter-buttons button {
        padding: 0.5rem 1rem;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        border-radius: 4px;
      }
      .filter-buttons .active {
        background: #333;
        color: #fff;
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1rem; 
        padding: 1rem;
        max-width: 1200px; 
        margin: 0 auto;
      }
      .gallery-item {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 0.5rem;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .gallery-item:hover {
        transform: scale(1.02);
      }
      .gallery-item img {
        max-width: 100%;
        border-radius: 4px;
      }
      .gallery-item h3 {
        margin: 0.5rem 0 0; 
        font-size: 1.1rem;
      }
      /* Modal Styling */
      .modal {
        position: fixed; 
        top: 0; 
        left: 0;
        width: 100%; 
        height: 100%;
        background: rgba(0,0,0,0.6);
        display: flex; 
        justify-content: center; 
        align-items: center;
        padding: 1rem;
        z-index: 999;
      }
      .modal-content {
        background: #fff;
        max-width: 800px;
        width: 100%;
        border-radius: 6px;
        position: relative;
        padding: 1rem;
      }
      .close-btn {
        position: absolute; 
        top: 1rem; 
        right: 1rem;
        background: none; 
        border: none;
        font-size: 1.2rem; 
        cursor: pointer;
      }
      video, img.modal-media {
        max-width: 100%; 
        margin-bottom: 1rem;
        display: block; 
        margin-left: auto; 
        margin-right: auto;
        border-radius: 4px;
      }
      .description {
        margin-top: 0.5rem; 
        line-height: 1.4;
      }
      .tags {
        font-size: 0.9rem;
        color: #666;
        margin-top: 0.5rem;
      }
    </style>
    <!-- Alpine.js CDN -->
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer></script>
  </head>
  <body>

    <header>
      <h1>My Shared Portfolio</h1>
      <p>Quick overview of my graphic/web/video projects</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button
        :class="{'active': filter === 'All'}"
        @click="filter = 'All'">
        All
      </button>
      <template x-for="cat in categories" :key="cat">
        <button
          :class="{'active': filter === cat}"
          @click="filter = cat"
          x-text="cat">
        </button>
      </template>
    </div>

    <!-- Gallery Grid -->
    <section class="gallery-grid">
      <template x-for="item in filteredItems" :key="item.id">
        <div class="gallery-item" @click="openModal(item)">
          <img :src="item.thumbnail" :alt="item.title">
          <h3 x-text="item.title"></h3>
          <!-- Display tags for websites -->
          <template x-if="item.mediaType === 'website'">
            <p class="tags" x-text="item.tags.join(', ')"></p>
          </template>
        </div>
      </template>
    </section>

    <!-- Modal / Lightbox -->
    <div
      class="modal"
      x-show="showModal"
      @click.self="closeModal()"
      x-transition>
      <div class="modal-content">
        <button class="close-btn" @click="closeModal()">✕</button>

        <!-- If media is a video -->
        <template x-if="selectedItem && selectedItem.mediaType === 'video'">
          <video controls x-bind:src="selectedItem.mediaUrl"></video>
        </template>

        <!-- If media is an image -->
        <template x-if="selectedItem && selectedItem.mediaType === 'image'">
          <img class="modal-media" x-bind:src="selectedItem.mediaUrl" alt />
        </template>

        <!-- If media is a website -->
        <template x-if="selectedItem && selectedItem.mediaType === 'website'">
          <iframe class="modal-media" x-bind:src="selectedItem.mediaUrl"
            frameborder="0"
            style="width: 100%; height: auto; aspect-ratio: 16/9; border-radius: 4px;"></iframe>
        </template>

        <h2 x-text="selectedItem ? selectedItem.title : ''"></h2>
        <p class="description"
          x-text="selectedItem ? selectedItem.description : ''"></p>
      </div>
    </div>

    <!-- Alpine.js Logic -->
    <script>
      /**
       * Dynamically generate a thumbnail for a video by loading a frame into a canvas.
       * Make sure your video is served with proper CORS headers (Access-Control-Allow-Origin)
       * if it's on a different domain.
       */
      async function generateThumbnail(videoUrl, seekTo = 1) {
        return new Promise((resolve, reject) => {
          const video = document.createElement('video');
          video.style.position = 'absolute';
          video.style.left = '-9999px';
          video.preload = 'metadata';
          video.crossOrigin = 'anonymous'; 
          video.src = videoUrl;

          // Once metadata is loaded, seek to a time to capture the frame
          video.addEventListener('loadedmetadata', () => {
            const duration = video.duration;
            // If the video is shorter than 'seekTo', go near the end
            if (seekTo > duration) seekTo = duration - 0.1;
            video.currentTime = seekTo;
          });

          // When the seek is done, draw the frame to a canvas
          video.addEventListener('seeked', () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/png'));
          });

          video.addEventListener('error', reject);
        });
      }

      function portfolioPage() {
        return {
          portfolioItems: [],
          filter: 'All',
          selectedItem: null,
          showModal: false,

          async init() {
            try {
              // Fetch your JSON file (adjust path/filename if necessary)
              const response = await fetch('./share-portfolio.json');
              this.portfolioItems = await response.json();

              // For each video item without a thumbnail, generate one
              for (let item of this.portfolioItems) {
                if (item.mediaType === 'video' && !item.thumbnail) {
                  try {
                    item.thumbnail = await generateThumbnail(item.mediaUrl);
                  } catch (err) {
                    console.error('Thumbnail generation failed:', err);
                    // Fallback thumbnail if desired
                    item.thumbnail = 'https://via.placeholder.com/300/000000/FFFFFF?text=No+Thumbnail';
                  }
                }
              }
            } catch (error) {
              console.error('Error fetching portfolio data:', error);
            }
          },

          get categories() {
            const cats = this.portfolioItems.map(item => item.category);
            return [...new Set(cats)];
          },

          get filteredItems() {
            if (this.filter === 'All') return this.portfolioItems;
            return this.portfolioItems.filter(item => item.category === this.filter);
          },

          openModal(item) {
            this.selectedItem = item;
            this.showModal = true;
          },

          closeModal() {
            this.showModal = false;
            this.selectedItem = null;
          }
        };
      }
    </script>

  </body>
  <footer
    style="background: #fff; padding: 1rem; text-align: center; box-shadow: 0 -1px 6px rgba(0,0,0,0.1);">
    <a href="https://alexgonzalez.ooo//public/cv+resume/index.html"
      target="_blank"
      style="color: #333; text-decoration: none; font-weight: bold;">View my
      full CV in print format</a>
    <p>
      <a href="https://alexgonzalez.ooo" target="_blank"
        style="color: #333; text-decoration: none; font-weight: bold;">Return
        Home</a>
    </p>
  </footer>
</html>
