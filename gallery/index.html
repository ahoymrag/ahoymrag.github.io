<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>


    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  </head>
  <body>
    <div class="superGallery">
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800;900&display=swap");

        .bigAss img {
          width: 100%;
          height: auto;
          animation: saturationBrightness 10s infinite alternate;
        }

        h1 {
          font-size: 16vw;
          text-align: center;
          padding: 10px;
          font-family: "Barlow", sans-serif;
          font-weight: 900;
          letter-spacing: -2.5px;
        }

        html {
          font-family: "Barlow", sans-serif;
        }
        a {
          font-size: 52px;
          color: #000000;
          font-weight: 900;
          text-decoration: none;
        }
        a:hover {
          text-decoration: underline;
        }

        .glassFooter a {
          color: #fff;
          text-decoration: none;
          background: linear-gradient(45deg, #ff6b6b, #f06595);
          padding: 10px 20px;
          border-radius: 5px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
          transition: background 0.3s ease, transform 0.3s ease;
        }
        .glassFooter a:hover {
          background: linear-gradient(45deg, #f06595, #ff6b6b);
          transform: scale(1.05);
        }

        @keyframes saturationBrightness {
          0% {
            filter: saturate(100%) brightness(100%);
          }
          50% {
            filter: saturate(150%) brightness(120%);
          }
          100% {
            filter: saturate(100%) brightness(100%);
          }
        }
      </style>
      <div class="bigAss" x-data="{ showDescription: false }">
        <h1>Paintings</h1>
        <p x-show="showDescription">This is a collection of beautiful paintings.</p>
        <img
          src="../gallery/portfolio-imagery/Alex Gonzalez Portfolio - Filmmaker - VR - 2020  2020-08-16 at 4.31.35 PM.png"
          alt="ahoy logo"
          @click="showDescription = !showDescription"
        />
        <img
          src="../gallery/portfolio-imagery/Alex Gonzalez Portfolio - Filmmaker - VR - 2020  2020-08-16 at 4.32.03 PM.png"
          alt="ahoy logo"
        />
        <img
          src="../gallery/portfolio-imagery/Alex Gonzalez - Watercolor - Blue Santa.jpg"
          alt="blueSantaBlues"
        />
      </div>
    </div>

    <div class="container">
      <div id="gallery" class="row">
        <!-- Images will be inserted here -->
      </div>
    </div>

    <div id="imageModal" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-body">
            <img id="popupImage" class="img-fluid" src="" />
          </div>
        </div>
      </div>
    </div>
    <style>
      .glassFooter {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 20px;
        text-align: center;
      }
      .glassFooter a {
        color: #fff;
        text-decoration: none;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 10px 20px;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }
      .glassFooter a:hover {
        background-color: rgba(0, 0, 0, 0.8);
      }
    </style>
    <footer class="glassFooter">
      <a href="../index.html" class="btn">Back to Home</a>
    </footer>
  </body>
</html>
