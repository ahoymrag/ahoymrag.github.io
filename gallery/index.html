<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="gallery" class="row">
            <!-- Images will be inserted here -->
        </div>
    </div>
    
    <div id="imageModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-body">
                    <img id="popupImage" class="img-fluid" src="">
                </div>
            </div>
        </div>
    </div>
    <style>
        .glassFooter {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            text-align: center;
        }
        .glassFooter a {
            color: #fff;
            text-decoration: none;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .glassFooter a:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
    <footer class="glassFooter">
        <a href="/index.html" class="btn">Back to Home</a>
    </footer>

    <style>
        #gallery .col-md-4 {
            margin-bottom: 20px;
        }
        #gallery img {
            width: 100%;
            height: auto;
        }
    </style>
    <script>
        $(document).ready(function() {
            // Load initial images
            loadImages();
    
            // Handle image click
            $('#gallery').on('click', 'img', function() {
                $('#popupImage').attr('src', $(this).attr('src'));
                $('#imageModal').modal('show');
            });
    
            // Handle scroll
            $(window).scroll(function() {
                if ($(window).scrollTop() + $(window).height() >= $(document).height()) {
                    loadImages();
                }
            });
        });
    
        function loadImages() {
            for (let i = 0; i < 3; i++) {
                let imageUrl = 'https://source.unsplash.com/random?' + Math.random();
                $('#gallery').append('<div class="col-md-4"><img src="' + imageUrl + '"></div>');
            }
        }
    </script>


</body>
</html>
