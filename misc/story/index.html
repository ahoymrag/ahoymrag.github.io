<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Storyboard</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            /* Add this CSS to style the watermark */
            .watermark {
                position: fixed;
                bottom: 10px;
                right: 10px;
                font-size: 12px;
                color: rgba(0, 0, 0, 0.5);
                pointer-events: none; /* Ensures the watermark doesn't interfere with other elements */
            }
        </style>
    </head>
    <body>
        <div id="storyboard">
            <div id="slide" class="slide">
                <img src id="slideImage" alt="Storyboard Image">
                <p id="slideText"></p>
            </div>
            <button id="prev" onclick="changeSlide(-1)">Prev</button>
            <button id="next" onclick="changeSlide(1)">Next</button>
        </div>
        <div id="allSlides"></div>
        <div class="watermark">Written and coded by Alex Gonzalez</div>
        <script src="./scripts.js"></script>
    </body>
</html>
