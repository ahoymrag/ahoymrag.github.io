<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Eisenhower Box</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f9;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .box {
            padding: 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        h2 {
            color: #333;
        }
        ul {
            list-style-type: none;
        }
        li {
            margin: 10px 0;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
        }
    </style>
    </head>
    <body>
        <h1>Eisenhower Box</h1>
        <div class="container">
            <div class="box">
                <h2>Urgent & Important</h2>
                <ul>
                    <li>Task 1</li>
                    <li>Task 2</li>
                    <!-- Add more tasks here -->
                </ul>
            </div>
            <div class="box">
                <h2>Not Urgent & Important</h2>
                <ul>
                    <li>Task 3</li>
                    <li>Task 4</li>
                    <!-- Add more tasks here -->
                </ul>
            </div>
            <div class="box">
                <h2>Urgent & Not Important</h2>
                <ul>
                    <li>Task 5</li>
                    <li>Task 6</li>
                    <!-- Add more tasks here -->
                </ul>
            </div>
            <div class="box">
                <h2>Not Urgent & Not Important</h2>
                <ul>
                    <li>Task 7</li>
                    <li>Task 8</li>
                    <!-- Add more tasks here -->
                </ul>
            </div>
        </div>
    </body>
</html>
