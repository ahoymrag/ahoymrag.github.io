<!DOCTYPE html>
<html>
<head>
    <title>New Haven Vending Solutions</title>
    <style>
        /* Assuming the primary color is a light shade */
        body {
            background-color: #E0F7FA; /* Replace with the exact background color of the logo */
            font-family: Arial, sans-serif;
            color: #404040; /* Neutral color for text */
        }

        .header {
            background-color: #009688; /* Replace with secondary color from logo */
            text-align: center;
            padding: 20px 0;
        }

        .header img {
            max-width: 150px; /* Logo size, adjust as needed */
        }

        .content {
            text-align: center;
            padding: 40px 20px;
        }

        .content h1 {
            color: #004D40; /* Tertiary color for headers */
        }

        .call-to-action {
            background-color: #FFC107; /* Highlight color */
            color: white;
            padding: 10px 20px;
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="path_to_logo.png" alt="New Haven Vending Solutions Logo"> <!-- Replace with the path to your logo -->
    </div>

    <div class="content">
        <h1>Welcome to New Haven Vending Solutions</h1>
        <p>Your one-stop shop for convenient snacks and beverages right where you need them.</p>
        <a href="#services" class="call-to-action">Explore Our Services</a>
    </div>

</body>
</html>
