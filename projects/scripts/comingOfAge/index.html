<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Screenplay Viewer</title>
        <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 1in 1in 1in 1.5in; /* Top, Right, Bottom, Left margins */
            background-color: #f4f4f4;
        }
        .scene {
            margin-bottom: 0.5in;
            page-break-inside: avoid;
        }
        .location {
            font-weight: bold;
            margin-bottom: 0.1in;
        }
        .action {
            margin-bottom: 0.1in;
            white-space: pre-wrap;
        }
        .dialogue {
            text-align: center;
            margin-bottom: 0.1in;
        }
        .character {
            font-weight: bold;
        }
        .page-number {
            position: fixed;
            top: 0.5in;
            right: 1in;
            font-size: 12px;
        }
        select {
            position: fixed;
            top: 10px;
            left: 10px;
        }
    </style>
    </head>
    <body>
        <select id="scene-selector" onchange="navigateToScene(this.value)">
            <option>Select a Scene</option>
        </select>
        <div id="screenplay"></div>
        <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('screenplay.json')
                .then(response => response.json())
                .then(data => {
                    const screenplay = document.getElementById("screenplay");
                    const selector = document.getElementById("scene-selector");

                    data.scenes.forEach((scene, index) => {
                        const sceneDiv = document.createElement("div");
                        sceneDiv.className = "scene";
                        sceneDiv.id = `scene-${scene.sceneNumber}`;
                        sceneDiv.innerHTML = `
                            <div class="location">${scene.location}</div>
                            <div class="action">${scene.action}</div>
                            ${scene.dialogues.map(dialogue => `
                                <div class="dialogue"><span class="character">${dialogue.character}:</span> ${dialogue.line}</div>
                            `).join('')}
                        `;
                        screenplay.appendChild(sceneDiv);

                        const option = document.createElement('option');
                        option.value = `scene-${scene.sceneNumber}`;
                        option.textContent = `Scene ${scene.sceneNumber}`;
                        selector.appendChild(option);
                    });
                    addPageNumbers();
                })
                .catch(error => console.error("Error loading screenplay data:", error));
        });

        function addPageNumbers() {
            const pages = document.createElement('div');
            pages.className = 'page-number';
            document.body.appendChild(pages);

            let currentPage = 1;
            const scenes = document.querySelectorAll('.scene');
            scenes.forEach((scene, index) => {
                if (index % 5 === 0 && index !== 0) { // Assuming each page can hold 5 scenes
                    currentPage++;
                }
                const pageNumberDiv = document.createElement('div');
                pageNumberDiv.className = 'page-number';
                pageNumberDiv.textContent = `Page ${currentPage}`;
                scene.appendChild(pageNumberDiv);
            });
        }

        function navigateToScene(sceneId) {
            const sceneElement = document.getElementById(sceneId);
            sceneElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
    </body>
</html>
