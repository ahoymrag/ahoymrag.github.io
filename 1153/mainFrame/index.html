<html>
    <head>
        <title>1153 : mainframe</title>
       <link rel="stylesheet" type="text/css" href="/ahoymrag.github.io/1153/mainFrame/mainFrame.css">

       <script>
        // Function to fetch and display GitHub updates for 'agOOO' repository
        function fetchAgOOOUpdates() {
            // Replace 'YOUR_USERNAME' with your GitHub username
            const username = 'oooahoyooo';

            // Replace 'YOUR_REPO_NAME' with the name of your GitHub repository
            const repo = 'oooahoyooo.github.io';

            // Fetch the latest commit from the repository
            fetch(`https://api.github.com/repos/${username}/${repo}/commits`)
                .then(response => response.json())
                .then(data => {
                    // Display the latest commit information
                    const commit = data[0];
                    const commitMessage = commit.commit.message;
                    const commitAuthor = commit.commit.author.name;
                    const commitDate = new Date(commit.commit.author.date);

                    const commitElement = document.getElementById('agOOO-commit-info');
                    commitElement.innerHTML = `
                        <h3>Latest Commit:</h3>
                        <p><strong>Date:</strong> ${commitDate}</p>
                        <p><strong>Message:</strong> ${commitMessage}</p>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // Function to fetch and display GitHub updates for 'ahoyOOO' repository
        function fetchAhoyOOOUpdates() {

                .then(response => response.json())
                .then(data => {
                    // Display the latest commit information
                    const commit = data[0];

                    const commitAuthor = commit.commit.author.name;
                    const commitDate = new Date(commit.commit.author.date);

                    const commitElement = document.getElementById('ahoyOOO-commit-info');
                    commitElement.innerHTML = `
                        <h3>Latest Commit:</h3>
                        <p><strong>Date:</strong> ${commitDate}</p>
                        <p><strong>Message:</strong> ${commitMessage}</p>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // Fetch GitHub updates when the page loads
        window.onload = function() {
            fetchAgOOOUpdates();
            fetchAhoyOOOUpdates();
        };
    </script>
</head>
