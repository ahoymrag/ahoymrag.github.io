<html>
    <head>
        <title>1153 : mainframe</title>
        <style>
            body {
                background-color: ivory;
                color: grey;
                font-size: 16px;
                font-weight: 900px;
            }

            .search-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #eed3ff;
            padding: 10px;
            min-width:300px;
            z-index: 9999;
            border-style:solid;
            border-color:purple;
            display:flex;
            align-items:center;
            justify-content: center;
        }

        .search-class {
            background-color:rgb(255, 255, 224);
            min-width:90%;
            display:flex;
            align-items:center;
            justify-items: center;
            text-transform: uppercase;
            font-size:22px;
            text-align:center;
            border-style:solid;
            border-color:purple;
            color:purple!important;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 100px;
            padding: 20px;
        }

        .github-updates {
            background-color: #e9cbff;
            padding: 20px;
            border-style:solid;
            border-color:purple;
            color:purple;
        }
        </style>
       <script>
        // Function to fetch and display GitHub updates for 'agOOO' repository
        function fetchAgOOOUpdates() {
            // Replace 'YOUR_USERNAME' with your GitHub username
            const username = 'oooahoyooo';

            // Replace 'YOUR_REPO_NAME' with the name of your GitHub repository
            const repo = 'oooahoyooo.github.io';

            // Fetch the latest commit from the repository
            fetch(`https://api.github.com/repos/${username}/${repo}/commits`)
                .then(response => response.json())
                .then(data => {
                    // Display the latest commit information
                    const commit = data[0];
                    const commitMessage = commit.commit.message;
                    const commitAuthor = commit.commit.author.name;
                    const commitDate = new Date(commit.commit.author.date);

                    const commitElement = document.getElementById('agOOO-commit-info');
                    commitElement.innerHTML = `
                        <h3>Latest Commit:</h3>
                        <p><strong>Date:</strong> ${commitDate}</p>
                        <p><strong>Message:</strong> ${commitMessage}</p>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // Function to fetch and display GitHub updates for 'ahoyOOO' repository
        function fetchAhoyOOOUpdates() {
            // Replace 'YOUR_USERNAME' with your GitHub username
            const username = 'ahoymrag';

            // Replace 'YOUR_REPO_NAME' with the name of your GitHub repository
            const repo = 'ahoymrag.github.io';

            // Fetch the latest commit from the repository
            fetch(`https://api.github.com/repos/${username}/${repo}/commits`)
                .then(response => response.json())
                .then(data => {
                    // Display the latest commit information
                    const commit = data[0];
                    const commitMessage = commit.commit.message;
                    const commitAuthor = commit.commit.author.name;
                    const commitDate = new Date(commit.commit.author.date);

                    const commitElement = document.getElementById('ahoyOOO-commit-info');
                    commitElement.innerHTML = `
                        <h3>Latest Commit:</h3>
                        <p><strong>Date:</strong> ${commitDate}</p>
                        <p><strong>Message:</strong> ${commitMessage}</p>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // Fetch GitHub updates when the page loads
        window.onload = function() {
            fetchAgOOOUpdates();
            fetchAhoyOOOUpdates();
        };
    </script>
</head>
<body>
    <div class="search-bar">
        <input class="search-class" type="text" placeholder="....">
    </div>
    <header>
        <h1>1153 : mainframe</h1>
    </header>
    <main>
        <div class="grid-container">
            <div id="agOOO" class="github-updates">
                <h3>ahoy ooo GitHub Updates:</h3>
                <div id="agOOO-commit-info"></div>
            </div>
            <div id="ahoyOOO" class="github-updates">
                <h3>ag ooo GitHub Updates:</h3>
                <div id="ahoyOOO-commit-info"></div>
            </div>
        </div>
    </main>
</body>
</html>
