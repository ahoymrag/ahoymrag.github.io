<!DOCTYPE html>
<html>
<head>
  <title>Note Taking App</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
  <style>
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 10px;
    }

    button {
      display: block;
      margin: 10px auto;
    }

    .note {
      background-color: #f5f5f5;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 9999;
    }

    .popup-content {
      margin-bottom: 10px;
    }

    .popup-close {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Note Taking App</h1>
    <form id="noteForm">
      <textarea id="noteInput" placeholder="Type your note here"></textarea>
      <button type="submit">Add Note</button>
    </form>
    <div id="noteList"></div>
    <table id="noteTable">
      <thead>
        <tr>
          <th>Note</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="noteDB.js"></script>
  <script>
    // Retrieve notes when the page loads
    getNotes();

    // Display note content in a pop-up when clicked
    document.getElementById('noteTable').addEventListener('click', function (event) {
      const target = event.target;
      if (target.classList.contains('note')) {
        const noteContent = target.dataset.content;
        displayPopup(noteContent);
      }
    });

    // Display a pop-up with note content
    function displayPopup(content) {
      // Create pop-up elements
      const popup = document.createElement('div');
      popup.className = 'popup';
      const popupContent = document.createElement('div');
      popupContent.className = 'popup-content';
      const closeBtn = document.createElement('div');
      closeBtn.className = 'popup-close';
      closeBtn.textContent = 'Close';
      // Set note content
      popupContent.textContent = content;
      // Append elements to the pop-up
      popup.appendChild(popupContent);
      popup.appendChild(closeBtn);
      // Append pop-up to the body
      document.body.appendChild(popup);
      // Close pop-up when close button is clicked
      closeBtn.addEventListener('click', function () {
        document.body.removeChild(popup);
      });
    }
  </script>
</body>
</html>
