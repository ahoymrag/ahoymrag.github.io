<!DOCTYPE html>
<html>
<head>
    <title>All Ape</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: url("6.png");
            background-size:cover;
            box-shadow: inset 0 0 10px #c9c9c9;
            animation: gradientAnimation 10s linear infinite ease-in-out;
        }
        
        .container {
            text-align: center;
            padding: 20px;
        }
        
        .logo {
            max-width: 33%;
            max-width:100px;
            height: auto;
            margin-bottom: 20px;
        }

        .logo-product {
            
            max-width:300px;
            height: auto;
            margin-bottom: 20px;
        }
        
        .github-link {
            font-size: 18px;
            text-decoration: none;
            width:200px;
            max-width:200px;
            height:auto;
        }


        @keyframes gradientAnimation {
    0% {
        background: linear-gradient(to right, #e2e2e2, #c0c0c0);
    }
    25% {
        background: linear-gradient(to right, #d0d0d0, #c0c0c0);
    }
    50% {
        background: linear-gradient(to right, #c0c0c0, #a0a0a0);
    }
    75% {
        background: linear-gradient(to right, #a0a0a0, #808080);
    }
    100% {
        background: linear-gradient(to right, #808080, #e2e2e2);
    }
}


.fullwidth-wrap {
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom: 20px;

}

    </style>
</head>
<body>
    <div class="container">
        <div class="fullwidth-wrap">
        <div class="logo">
            <img src="./1.png" alt="Logo" class="logo">
        </div>
    </div>
    <div class="ape-product-menu">
        <a href="https://github.com/ApeWorX/ape" class="github-link"><img src="./2.png" alt="Logo" class="logo-product">
        </a>
        <a href="https://github.com/ApeWorX/ape" class="github-link"><img src="./3.png" alt="Logo" class="logo-product">
        </a>
        <a href="https://github.com/ApeWorX/ape" class="github-link"><img src="./3_silver.png" alt="Logo" class="logo-product">
        </a>
        <a href="https://github.com/ApeWorX/ape" class="github-link"><img src="./4.png" alt="Logo" class="logo-product">
        </a>

    </div>
</body>
</html>
