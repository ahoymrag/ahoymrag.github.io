<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daily Dashboard</title>
        <script
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
            defer></script>

        <link rel="stylesheet" href="./styles/styles.css">
    </head>
    <body>
        <div
            x-data="{ startMenuOpen: false, currentTime: '', currentDate: '', newGoal: '', goals: [] }"
            x-init="setInterval(() => { currentTime = new Date().toLocaleTimeString(); currentDate = new Date().toLocaleDateString(); }, 1000)">
            <!-- Top Bar -->
            <div class="top-bar glass-effect">
                <h1>Daily Dashboard OS</h1>
                <div class="os-info">
                    <span x-text="currentTime"></span>
                    <span x-text="currentDate"></span>
                </div>
            </div>

            <!-- Main Content -->
            <div class="dashboard">
                <input type="text" x-model="newGoal"
                    placeholder="Enter your goal" />
                <button @click="goals.push(newGoal); newGoal = ''">Add
                    Goal</button>
                <ul>
                    <template x-for="(goal, index) in goals" :key="index">
                        <li>
                            <span x-text="goal"></span>
                            <button
                                @click="goals.splice(index, 1)">Remove</button>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Start Button -->
            <div class="bottom-bar">
                <button @click="startMenuOpen = !startMenuOpen">Start</button>
                <div x-show="startMenuOpen" class="start-menu">
                    <ul>
                        <li><button
                                @click="goals.push(newGoal); newGoal = ''">Add
                                Goal</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </body>
</html>
