<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ellen Martin Art</title>
        <link rel="stylesheet" href="./ellen.css">
        <!-- Add Magic Zoom CSS and JS -->
        <link rel="stylesheet" href="magiczoom/magiczoom.css">
        <script src="magiczoom/magiczoom.js"></script>
    </head>
    <body>
        <header>
            <h1>Ellen Martin Art</h1>
            <p>Inked and Watercolor Portraits of New Haven Buildings & also
                fish</p>
        </header>
        <main>
            <section>
                <article>
                    <a href="large-artwork1.jpg" class="MagicZoom"
                        data-options="zoomWidth:400; zoomHeight:400; expandZoomMode:fullscreen; zoomPosition: inner;">
                        <figure>
                            <img src="small-artwork1.jpg" alt="Artwork 1">
                            <figcaption>Artwork 1 Description</figcaption>
                        </figure>
                    </a>
                </article>
                <article>
                    <a href="large-artwork2.jpg" class="MagicZoom"
                        data-options="zoomWidth:400; zoomHeight:400; expandZoomMode:fullscreen; zoomPosition: inner;">
                        <figure>
                            <img src="small-artwork2.jpg" alt="Artwork 2">
                            <figcaption>Artwork 2 Description</figcaption>
                        </figure>
                    </a>
                </article>
                <article>
                    <a href="large-artwork3.jpg" class="MagicZoom"
                        data-options="zoomWidth:400; zoomHeight:400; expandZoomMode:fullscreen; zoomPosition: inner;">
                        <figure>
                            <img src="small-artwork3.jpg" alt="Artwork 3">
                            <figcaption>Artwork 3 Description</figcaption>
                        </figure>
                    </a>
                </article>
            </section>
        </main>
        <script src="./artworks.js"></script>
    </body>
</html>
