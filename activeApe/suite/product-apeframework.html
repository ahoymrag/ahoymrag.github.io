<html>
    <head>
        <title>
            product-apeFramework
        </title>
        <link rel="stylesheet" href="../ape-design-system.css">
    </head>
    <body class="body-productPage-ape">
        <div class="screen">
            <div id="topLogo" class="component c1">
                <div class="card--center-card">
                    <img src="https://apeworx.io/framework/frame.png"
                        alt="ApeWorx Icon"
                        class="logo logo--style-1">

                </div>
                <div id="subheader-product" class="card--center-card">
                    <p>The most advanced smart contract framework on earth
                        Trusted by Yearn, Lido, CURVE, Element and more
                    </p>
                </div>
            </div>
            <div class="component c1" id="product-apeFrameWork-desc">
                <div class="card--center-card"
                    id="product-apeFramework-description">
                    <div class="panel --panel-style-2">
                        <div class="item-container vertical">
                            <p>Access Multiple Chains at the Same Time</p>
                            <p>Customize your stack with Ape Plugins</p>

                            <p>Extensive contract lifecycle management
                                features:</p>

                            <p>Access Multiple Chains at the Same Time</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="component c1" id="timeNtemp">
                <div class="time-display" id="clock"></div>
                <div class="temp-display" id="temp"></div>
            </div>

        </div>
        <button class="btn--default"
            onclick="location.href='master-suite.html';">Back</button>
        <script>
            function updateClock() {
                const now = new Date();
                const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.getElementById('clock').textContent = time;
            }
            setInterval(updateClock, 1000);
            updateClock();
        </script>
    </body>
</html>
