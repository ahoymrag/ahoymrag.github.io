<html>
    <head>
        <title>ApeWorx Master Suite</title>
        <link rel="stylesheet" href="../ape-design-system.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            :root {
                --mastersuite-gradient-color-1: #001f3f;
                --mastersuite-gradient-color-2: #250000;
                --mastersuite-gradient-color-3: #002e66;
                --mastersuite-gradient-color-4: #003366;
                --mastersuite-gradient-color-5: #001f3f;
                --mastersuite-ripple-duration: 15s;
            }
            
            .body-masterSuite {
                color: white;
                background: radial-gradient(
                    circle at center,
                    var(--mastersuite-gradient-color-1) 0%,
                    var(--mastersuite-gradient-color-2) 25%,
                    var(--mastersuite-gradient-color-3) 50%,
                    var(--mastersuite-gradient-color-4) 75%,
                    var(--mastersuite-gradient-color-5) 100%
                );
                background-size: 200% 200%;
                animation: rippleAnimation var(--mastersuite-ripple-duration) ease-in-out infinite;
                font-family: 'Barlow', sans-serif;
                margin: 0;
                padding: 2rem;
                min-height: 100vh;
            }
            
          
            
            .body-masterSuite h1,h2,h3,h4,h5,p {
                color: rgb(255, 255, 255);
            }
            </style>
    </head>
    <body class="body-masterSuite">
        <div class="screen">
            <div id="topLogo" class="component c1">
                <div class="card--center-card">
                    <img src="Apeworx_Icon_Grey-S.png" alt="ApeWorx Icon"
                        class="logo logo--style-1">
                </div>
            </div>
            <div class="component c1">
                <div class="item-grid--style-1">
                    <a href="product-apeframework.html"
                        class="item-block--style-1" id="apeFramework">
                        <img src="path/to/apeframework-icon.png"
                            alt="ApeFramework Icon">
                        <h3>apeFramework</h3>
                        <p>Build dApps with ease</p>
                    </a>
                    <a href="product-silverback.html"
                        class="item-block--style-1" id="silverback">
                        <img src="path/to/silverback-icon.png"
                            alt="Silverback Icon">
                        <h3>Silverback</h3>
                        <p>Powerful dev environment</p>
                    </a>
                    <a href="product-apepay.html" class="item-block--style-1"
                        id="apePay">
                        <img src="path/to/apepay-icon.png" alt="ApePay Icon">
                        <h3>ApePay</h3>
                        <p>Fast crypto payments</p>
                    </a>
                    <a href="product-chaosnet.html" class="item-block--style-1"
                        id="chaosnet">
                        <img src="path/to/chaosnet-icon.png"
                            alt="Chaosnet Icon">
                        <h3>cHaOSneT</h3>
                        <p>Decentralized network</p>
                    </a>
                    <a href="product-academy.html" class="item-block--style-1"
                        id="academy">
                        <img src="path/to/academy-icon.png"
                            alt="Ape Academy Icon">
                        <h3>Ape Academy</h3>
                        <p>Learn blockchain dev</p>
                    </a>
                </div>
            </div>

            <div class="component c1" id="timeNtemp">
                <div class="time-display" id="clock"></div>
                <div class="temp-display" id="temp"></div>
            </div>

        </div>
        <script>
            function updateClock() {
                const now = new Date();
                const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.getElementById('clock').textContent = time;
            }
            setInterval(updateClock, 1000);
            updateClock();
        </script>
    </body>
</html>
