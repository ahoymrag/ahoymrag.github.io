            rel="icon"

        <style>
            body {
                background-color: #000;
                color: #00ff00;
                font-family: 'VT323', 'Courier New', monospace;
                margin: 0;
                padding: 20px;
                line-height: 1.6;
                cursor: none;
            }

            .header-main-wrap, main, section {
                background-color: #000;
                border: 2px solid #00ff00;
                border-radius: 0;
                padding: 20px;
                margin-bottom: 20px;
            }

            h1, h2, h3 {
                color: #00ff00;
            }

            .nav-ul {
                list-style: none;
                padding: 0;
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
            }

            .nav-ul li {
                margin: 10px;
            }

            .header-button {
                background-color: #000;
                border: 2px solid #00ff00;
                border-radius: 0;
                padding: 10px 20px;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .header-button:hover {
                background-color: #00ff00;
                color: #000;
            }

            a {
                color: #00ff00;
                text-decoration: none;
                transition: color 0.3s ease;
            }

            a:hover {
                color: #fff;
            }

            ul {
                list-style-type: none;
                padding-left: 0;
            }

            li {
                margin-bottom: 10px;
            }

            .footer-copy {
                text-align: center;
                color: #00ff00;
            }

            /* Add CRT screen effect */
            @keyframes flicker {
                0% {
                    opacity: 0.9;
                }
                5% {
                    opacity: 0.8;
                }
                10% {
                    opacity: 0.9;
                }
                15% {
                    opacity: 0.85;
                }
                20% {
                    opacity: 0.9;
                }
                100% {
                    opacity: 1;
                }
            }

            body::before {
                content: " ";
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
                z-index: 2;
                background-size: 100% 2px, 3px 100%;
                pointer-events: none;
                animation: flicker 0.15s infinite;
            }

            /* Custom cursor */
            #cursor {
                position: fixed;
                width: 10px;
                height: 20px;
                background-color: #00ff00;
                pointer-events: none;
                z-index: 9999;
            }

            /* Typewriter effect */
            .typewriter {
                overflow: hidden;
                border-right: .15em solid #00ff00;
                white-space: nowrap;
                margin: 0 auto;
                letter-spacing: .15em;
                animation: 
                    typing 3.5s steps(40, end),
                    blink-caret .75s step-end infinite;
            }

            @keyframes typing {
                from { width: 0 }
                to { width: 100% }
            }

            @keyframes blink-caret {
                from, to { border-color: transparent }
                50% { border-color: #00ff00; }
            }

            /* Glitch effect */
            .glitch {
                position: relative;
            }

            .glitch::before,
            .glitch::after {
                content: attr(data-text);
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            .glitch::before {
                left: 2px;
                text-shadow: -2px 0 #ff00ff;
                clip: rect(44px, 450px, 56px, 0);
                animation: glitch-anim 1.5s infinite linear alternate-reverse;
            }

            .glitch::after {
                left: -2px;
                text-shadow: -2px 0 #00ffff;
                clip: rect(44px, 450px, 56px, 0);
                animation: glitch-anim 5s infinite linear alternate-reverse;
            }

            @keyframes glitch-anim {
                0% { clip: rect(31px, 9999px, 94px, 0); }
                5% { clip: rect(70px, 9999px, 71px, 0); }
                10% { clip: rect(29px, 9999px, 83px, 0); }
                /* ... (add more keyframes as desired) ... */
                100% { clip: rect(67px, 9999px, 62px, 0); }
            }
        </style>
    </head>

    <body>
        <div id="cursor"></div>

                            <li><a
                                    href="./sb-master-2000/src/index_guide.html"><div

                                            class="typewriter">Design
                                            Guide</h3></div></a></li>
                            <li><a
                                    href="./sb-master-2000/src/cluster/clustersOverview.html"><div

                            <li><a
                                    href="./sb-master-2000/src/create-cluster/create-1.html"><div
                                        class="header-button"><h3
                                            class="typewriter">Create
                                            Cluster</h3></div></a></li>

                        </ul>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <p class="typewriter">Welcome to the Active Ape Projects terminal.
                Select your mission:</p>
            <!-- Add more content here -->
        </main>

        <footer>
            <p class="footer-copy typewriter">MMXXIV</p>
        </footer>

        <script>
            // Custom cursor movement
            document.addEventListener('mousemove', (e) => {
                const cursor = document.getElementById('cursor');
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });

            // Typewriter effect for dynamic content
            function typeWriter(element, text, i = 0) {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(() => typeWriter(element, text, i), 50);
                }
            }

            // Apply typewriter effect to elements with 'typewriter' class
            document.querySelectorAll('.typewriter').forEach(el => {
                const text = el.textContent;
                el.textContent = '';
                typeWriter(el, text);
            });
        </script>
    </body>
</html>
