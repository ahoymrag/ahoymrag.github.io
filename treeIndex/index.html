<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tree Value NFTs</title>
        <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet">
    </head>
    <body class="bg-gray-100 text-gray-900">
        <header class="bg-green-600 p-4 text-white text-center">
            <h1 class="text-3xl font-bold">Tree Value NFTs</h1>
            <p>Purchase NFTs based on the economic value of trees found in
                Singapore</p>
        </header>
        <main class="container mx-auto mt-8">
            <section class="mb-8">
                <h2 class="text-2xl font-semibold mb-4">Tree Catalog</h2>
                <div id="treeTableContainer"></div>
                <button id="addToCart"
                    class="mt-4 bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                    Add to Cart
                </button>
            </section>
            <!-- Existing content -->
        </main>
        <footer class="bg-gray-800 text-white text-center p-4 mt-8">
            <p>&copy; 2024 Tree Value NFTs. All rights reserved.</p>
        </footer>
        <script>
        fetch('src/trees.json')
            .then(response => response.json())
            .then(data => {
                const table = document.createElement('table');
                table.className = 'min-w-full leading-normal';
                const thead = document.createElement('thead');
                thead.innerHTML = `<tr>
                        <th class="py-2 px-4 border-b">Select</th>
                        <th class="py-2 px-4 border-b">Name</th>
                        <th class="py-2 px-4 border-b">Scientific Name</th>
                        <th class="py-2 px-4 border-b">Description</th>
                        <th class="py-2 px-4 border-b">Image</th>
                        <th class="py-2 px-4 border-b">Price (SGD)</th>
                    </tr>`;
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                data.forEach(tree => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-2 px-4 border-b"><input type="checkbox" class="tree-checkbox" data-id="${tree.id}"></td>
                        <td class="py-2 px-4 border-b">${tree.name}</td>
                        <td class="py-2 px-4 border-b">${tree.scientific_name}</td>
                        <td class="py-2 px-4 border-b">${tree.description}</td>
                        <td class="py-2 px-4 border-b"><img src="${tree.image}" alt="${tree.name}" style="width:100px;"></td>
                        <td class="py-2 px-4 border-b">${tree.price}</td>`;
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);

                document.getElementById('treeTableContainer').appendChild(table);
            })
            .catch(error => console.error('Error loading the tree data:', error));

        document.getElementById('addToCart').addEventListener('click', () => {
            const selectedTrees = document.querySelectorAll('.tree-checkbox:checked');
            const selectedIds = Array.from(selectedTrees).map(checkbox => checkbox.dataset.id);
            console.log('Selected Trees:', selectedIds);
            // Here you can handle adding to cart functionality
        });
    </script>
    </body>
</html>
