<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2024 Photos</title>
        <link rel="stylesheet" href="styles.css">

        <!-- SEO Meta Tags -->
        <meta name="description"
            content="Explore the 2024 unedited and randomly sorted photo collection by photographer Alex Gonzalez. Discover the raw beauty captured in each shot.">
        <meta name="keywords"
            content="2024 photos, Alex Gonzalez, unedited photography, random photo collection, photography collection 2024">
        <meta name="author" content="Alex Gonzalez">

        <!-- Open Graph Meta Tags for Social Media -->
        <meta property="og:title"
            content="2024 Photo Collection by Alex Gonzalez">
        <meta property="og:description"
            content="Explore the 2024 unedited and randomly sorted photo collection by photographer Alex Gonzalez. Discover the raw beauty captured in each shot.">
        <meta property="og:image" content="URL_to_a_representative_image.jpg">
        <meta property="og:url" content="URL_to_this_page">
        <meta property="og:type" content="website">

        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title"
            content="2024 Photo Collection by Alex Gonzalez">
        <meta name="twitter:description"
            content="Explore the 2024 unedited and randomly sorted photo collection by photographer Alex Gonzalez. Discover the raw beauty captured in each shot.">
        <meta name="twitter:image" content="URL_to_a_representative_image.jpg">
    </head>
    <body>

        <div id="photo-gallery">
            <div id="gallery-container"></div>
        </div>
        <div class="collection">
            <em>All photos are unedited, sorted by random order, and available
                for purchase.</em>
            <p>2024 Collection</p>
            <p>photographer |</p>
            <p>Alex Gonzalez</p>

        </div>
        <!-- Feedback Form -->
        <form id="feedback-form"
            action="https://formspree.io/f/xdkokkbv"
            method="POST">
            <input type="text" name="name" placeholder="Your Name"
                required>
            <input type="email" name="email" placeholder="Your Email"
                required>
            <textarea name="message" placeholder="Your Feedback"
                rows="5"
                required></textarea>
            <button type="submit">Send Feedback</button>
        </form>

        <script src="2024photos.js"></script>
    </body>
</html>
