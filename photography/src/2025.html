<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2025 Photos</title>
        <link rel="stylesheet" href="styles.css">

        <!-- SEO Meta Tags -->
        <meta name="description"
            content="Explore the 2025 unedited and randomly sorted photo collection by photographer Alex Gonzalez. Discover the raw beauty captured in each shot.">
        <meta name="keywords"
            content="2025 photos, Alex Gonzalez, unedited photography, random photo collection, photography collection 2025">
        <meta name="author" content="Alex Gonzalez">
        <!-- Open Graph Meta Tags for Social Media -->
        <meta property="og:title"
            content="2025 Photo Collection by Alex Gonzalez">
        <meta property="og:description"
            content="Explore the 2025 unedited and randomly sorted photo collection by photographer Alex Gonzalez. Discover the raw beauty captured in each shot.">
        <meta property="og:image" content="URL_to_a_representative_image.jpg">
        <meta property="og:url" content="URL_to_this_page">
        <meta property="og:type" content="website">

        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title"
            content="2025 Photo Collection by Alex Gonzalez">
        <meta name="twitter:description"
            content="Explore the 2025 unedited and randomly sorted photo collection by photographer Alex Gonzalez. Discover the raw beauty captured in each shot.">
        <meta name="twitter:image" content="URL_to_a_representative_image.jpg">

        <script
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
            defer></script>
    </head>
    <body>

        <div id="photo-gallery">
            <div id="gallery-container"></div>
        </div>
        <div class="collection">
            <em>All photos are unedited, sorted by random order, and available
                for purchase.</em>
            <p>2025 Collection</p>
            <p>photographer |</p>
            <p>Alex Gonzalez</p>

        </div>
        <!-- Feedback Form with Alpine.js -->
        <div x-data="{ open: false }">
            <button @click="open = !open" type="button">
                Toggle Feedback Form
            </button>
            <form x-show="open" id="feedback-form"
                action="https://formspree.io/f/xdkokkbv"
                method="POST">
                <input type="text" name="name" placeholder="Your Name"
                    required>
                <input type="email" name="email" placeholder="Your Email"
                    required>
                <textarea name="message" placeholder="Your Feedback"
                    rows="5"
                    required></textarea>
                <button type="submit">Send Feedback</button>
            </form>
        </div>

        <script src="2025photos.js"></script>
    </body>
</html>
