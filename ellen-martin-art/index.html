<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ellen Martin Art</title>
        <link rel="stylesheet" href="./ellen.css">
        <style>
       
    </style>
    </head>
    <body>
        <header>
            <h1>Ellen Martin Art </h1>
            <p>Inked and Watercolor Portraits of New Haven Buildings & also
                fish</p>
        </header>
        <main>
            <div class="art-grid">
                <div class="art-item">
                    <img src="new-haven-building-1.jpg"
                        alt="New Haven Building 1">
                    <h2>New Haven Town Hall</h2>
                    <p>Current Bid: $<span class="current-bid">150</span></p>
                    <form class="bid-form">
                        <input type="number" placeholder="Enter your bid"
                            min="151" step="1">
                        <button type="submit">Place Bid</button>
                    </form>
                </div>
                <div class="art-item">
                    <img src="fish-painting-1.jpg" alt="Fish Painting 1">
                    <h2>Colorful Koi</h2>
                    <p>Current Bid: $<span class="current-bid">200</span></p>
                    <form class="bid-form">
                        <input type="number" placeholder="Enter your bid"
                            min="201" step="1">
                        <button type="submit">Place Bid</button>
                    </form>
                </div>
                <!-- Add more art items here -->
            </div>
        </main>
        <script>
        document.querySelectorAll('.bid-form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const bidInput = this.querySelector('input');
                const currentBidSpan = this.parentElement.querySelector('.current-bid');
                const newBid = parseInt(bidInput.value);
                const currentBid = parseInt(currentBidSpan.textContent);

                if (newBid > currentBid) {
                    currentBidSpan.textContent = newBid;
                    bidInput.min = newBid + 1;
                    bidInput.value = '';
                    alert('Your bid has been placed successfully!');
                } else {
                    alert('Your bid must be higher than the current bid.');
                }
            });
        });
    </script>
    </body>
</html>
