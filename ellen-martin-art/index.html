<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ellen Martin Art</title>
        <link rel="stylesheet" href="./ellen.css">
        <!-- Add Magic Zoom CSS and JS -->
        <link rel="stylesheet" href="magiczoom/magiczoom.css">
        <script src="magiczoom/magiczoom.js"></script>
    </head>
    <body>
        <style>
            #artwork1 {
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: white;
                position: relative;
            }
            #artwork1 img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }
            .zoom-controls {
                position: absolute;
                top: 1rem;
                right: 1rem;
            }
            .zoom-btn {
                font-size: 2rem;
                background-color: #fff;
                border: none;
                padding: 0.5rem 1rem;
                cursor: pointer;
                margin-left: 1rem;
            }
        </style>
        <header>
            <h1>Ellen Martin Art</h1>
            <p>Inked and Watercolor Portraits of New Haven Buildings & also
                fish</p>
        </header>
        <section id="artwork1">
            <div class="zoom-controls">
                <button id="zoomIn" class="zoom-btn">+</button>
                <button id="zoomOut" class="zoom-btn">-</button>
            </div>
            <a href="large-artwork.jpg" class="MagicZoom"
                data-options="zoomWidth:400; zoomHeight:400; expandZoomMode:fullscreen;">
                <img src="small-artwork.jpg" alt="Artwork 1">
            </a>
        </section>
        <main>

            <div class="art-grid" id="artGrid">
                <!-- Artwork items will be dynamically inserted here -->
            </div>
        </main>
        <script src="./artworks.js"></script>
    </body>
</html>
