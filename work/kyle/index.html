<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyle</title>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Main Styles */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f6f6f6;
        }

        .menu {
            display: flex;
        }

        .menu-item {
            flex: 1;
            height: 200px;
            background-color: #fff;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .menu-item:hover {
            background-color: #ff8dd1;
        }

        .menu-item a {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Precision Craft Inc</h1>
    <div class="container">
        <div class="menu">
            <div class="menu-item">
                <a href="#">Experimental</a>
            </div>
            <div class="menu-item">
                <a href="#">Pending Features</a>
            </div>
            <div class="menu-item">
                <a href="#">Experimental</a>
            </div>
            <div class="menu-item">
                <a href="#">Pending Features</a>
            </div>
        </div>
    </div>
</body>
</html>
