<!DOCTYPE html>
<html>
<head>
    <title>All Ape Product</title>
    <style>

     
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            height:100vh;
            background-image: url("/ahoymrag.github.io/work/product_All_APE/assets/6.png");
            background-size:cover;
            box-shadow: inset 0 0 10px #c9c9c9;
            animation: gradientAnimation 10s linear infinite ease-in-out;
            
        }
        
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
           

        }

        header {
            width:100%;
            height:220px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        
        .logo {
            width:100px;
            max-width:200px;
            height: auto;
            margin:5px;
            opacity:.95;
        
            }

        .logo:hover {
            opacity: 0.93;
            cursor: pointer;
      
        }


        .ape-product-menu {
            width:100%;
            max-width:700px;
            display:flex;
            justify-content:center;
            align-items:center;


            
        }


        .logo-product {
            width:100%;
            height:auto;
          
            height: auto;
            margin-right:5px;
        }
        
        .github-link {
            font-size: 18px;
            text-decoration: none;
            max-width:200px;
            max-height:200px;
            overflow:hidden;
            height:auto;
            margin:2.5px;
       
            opacity:.95;
        }

        .github-link:hover { 
            opacity: 0.93;
            filter:invert(50%);
            mix-blend-mode: lighten;
        }


                @keyframes gradientAnimation {
            0% {
                background: linear-gradient(to right, #e2e2e2, #c0c0c0);
            }
            25% {
                background: linear-gradient(to right, #d0d0d0, #c0c0c0);
            }
            50% {
                background: linear-gradient(to right, #c0c0c0, #a0a0a0);
            }
            75% {
                background: linear-gradient(to right, #a0a0a0, #808080);
            }
            100% {
                background: linear-gradient(to right, #808080, #e2e2e2);
            }
        }


        .fullwidth-wrap {
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin-bottom: 20px;

        }

    </style>
</head>
<body>
    <header>
