<!DOCTYPE html>
<html>
<head>
    <title>Mission Anabaino</title>
<link rel="stylesheet" href="missionStyles.css">
</head>
<body>
    <header>
        <h1>Support Mission Anabaino</h1>
    </header>

    <div class="splash-page">
        <h1>Meet the</h1>
    </div>
<div class="full-width-wrapper">
    <div class="grid-container">
        <div class="grid-item" id="pastor1">
            <img src="assets/1.png" alt="Pastor 1">
            <p>Pastor 1</p>
        </div>
        <div class="grid-item" id="pastor2">
            <img src="assets/2.png" alt="Pastor 2">
            <p>Pastor 2</p>
        </div>
		<div class="grid-item" id="pastor3">
            <img src="assets/1.png" alt="Pastor 3">
            <p>Pastor 3</p>
        </div>
		<div class="grid-item" id="pastor4">
            <img src="assets/2.png" alt="Pastor 4">
            <p>Pastor 4</p>
        </div>
        <!-- Add more grid items as needed -->
    </div>
</div>



<footer class="glass-footer">
    <div class="footer-content">
        <div class="footer-section about">
            <h2>About Mission Anabaino</h2>
            <p><a href="about.html">Learn More</a></p>
            <p><a href="https://www.anabaino.org/giving">Partner with Us in Prayer and/or Financial Support
            </a></p>
        </div>
        <div class="footer-section contact">
            <h2>Contact Us</h2>
            <p><a href="contact.html">Contact</a></p>
            <p>Address: 123 Main St, Anytown, USA</p>
            <p>Phone: (123) 456-7890</p>
        </div>
        <div class="footer-section logo">
            <img src="assets/logo.png" alt="Mission Anabaino Logo">
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2023 Mission Anabaino</p>
    </div>
</footer>

    <!-- Modal for video popup -->
    <div class="modal" id="modal">
        <iframe id="video" width="560" height="315" frameborder="0"></iframe>
    </div>

    <script>
        // Open video modal
        function openModal(videoId) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('video').src = `https://www.youtube.com/embed/${videoId}`;
        }

        // Close video modal
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('video').src = '';
        }

        // Attach event listeners
        document.getElementById('pastor1').addEventListener('click', () => openModal('VIDEO_ID_1'));
        document.getElementById('pastor2').addEventListener('click', () => openModal('VIDEO_ID_2'));
        document.getElementById('modal').addEventListener('click', closeModal);
    </script>
</body>
</html>
