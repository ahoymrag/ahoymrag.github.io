<!DOCTYPE html>
<html>
<head>
    <title>AGtemplate = Big Bozyz</title>
    <!-- AS OF 7.21.23-->
    <link rel="stylesheet" href="./agTemplate-BigBoy.css">
</head>
<body>
    <div class="bigBoyBrand-Total">
        <div class="bigBoyBrand-Main">
            <!-- bigBoyNav -->
            <div class="bigBoyBrand-Nav">
                <div class="bigBoyBrand-Nav-Menu">
                    <ul>
                        <li onclick="goToSlide(1)">Item 1</li>
                        <li onclick="goToSlide(2)">Item 2</li>
                        <li onclick="goToSlide(3)">Item 3</li>
                        <!-- Add more slides here as needed -->
                    </ul>
                </div>
            </div>
            <style>
                .bbb-fc-body {
                    background-color:rgba(0, 128, 0, 0.486);
                    width:100%;
                    height:100vh;
                    display:flex;
                    flex-direction:column;
                    justify-content:center;
                    align-items:center;
                    
                }

                h1,h2,h3,h4,h5,h6 {
                    margin:0;
                    padding:0;
                }

                p {
                    margin:0;
                    padding:0;
                }
            </style>
            <!-- bigBoySlideApp -->
            <div class="bigBoyBrand-slideApp">
                <div id="slide1" class="bigBoyBrand-fc-SlideItem">Slide Body 1</div>
                <div id="slide2" class="bigBoyBrand-fc-SlideItem">
                    <div class="bbb-fc-body">
                        <div class="bbb-fc-body-header">
                            <h2>This is a header for slide 2 </h2>
                        </div>
                        <div class="bbb-fc-body-content">
                            <p>This is the content for slide 2 </p>
                        </div>
                    </div>
                </div>
                <div id="slide3" class="bigBoyBrand-fc-SlideItem">
                    <div class="bbb-fc-body">
                        <div class="bbb-fc-body-header">
                            <h2>This is a header for slide 3 </h2>
                        </div>
                        <div class="bbb-fc-body-content">
                            <p>This is the content for slide 3 </p>
                        </div>
                    </div>
                </div>
                <div id="slide4" class="bigBoyBrand-fc-SlideItem">Slide Body 4</div>
                <div id="slide5" class="bigBoyBrand-fc-SlideItem">Slide Body 5</div>
                <div id="slide6" class="bigBoyBrand-fc-SlideItem">Slide Body 6</div>
                <div id="slide7" class="bigBoyBrand-fc-SlideItem">Slide Body 7</div>
                <div id="slide8" class="bigBoyBrand-fc-SlideItem">Slide Body 8</div>
                <div id="slide9" class="bigBoyBrand-fc-SlideItem">Slide Body 9</div>
                <div id="slide10" class="bigBoyBrand-fc-SlideItem">Slide Body 10</div>
                <!-- Add more slides here as needed -->
            </div>
        </div>
    </div>

 
</body>
</html>
