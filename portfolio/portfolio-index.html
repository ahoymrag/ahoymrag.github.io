<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Index</title>
        <link rel="stylesheet" href="index-style.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&display=swap"
            rel="stylesheet">
        <style>
            body {
                font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                background:
                    radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.07), transparent 24rem),
                    linear-gradient(135deg, #111 0%, #111 55%, #181818 100%);
                color: #fff;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .container {
                width: min(1120px, calc(100% - 64px));
                padding: 84px 0;
            }

            h1 {
                font-size: clamp(2.8rem, 7vw, 6.5rem);
                line-height: .9;
                letter-spacing: -.07em;
                margin: 0;
            }

            .intro {
                max-width: 560px;
                color: #bdbdbd;
                font-size: 1.05rem;
                line-height: 1.6;
                margin: 24px 0 64px;
            }

            .eyebrow {
                color: #8f8f8f;
                font-size: .75rem;
                font-weight: 700;
                letter-spacing: .16em;
                margin: 0 0 18px;
                text-transform: uppercase;
            }

            .year-card {
                position: relative;
                display: inline-block;
                width: 300px;
                height: 200px;
                margin: 8px;
                background-color: #fff;
                border: 1px solid rgba(255, 255, 255, 0.9);
                border-radius: 0;
                box-shadow: none;
                text-decoration: none;
                color: #111;
                font-size: 1.45em;
                font-weight: 700;
                line-height: normal;
                vertical-align: middle;
                overflow: hidden;
                transition: background-color 0.2s, color 0.2s, transform 0.2s;
            }

            .year-card::before {
                content: '';
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #111;
                transition: top 0.25s ease;
                z-index: 0;
            }

            .year-card:hover::before {
                top: 0;
            }

            .year-card:hover {
                color: #fff;
                transform: translateY(-4px);
            }

            .year-card:active {
                animation: explode 0.3s forwards;
            }

            @keyframes explode {
                0% {
                    transform: scale(1);
                }
                100% {
                    transform: scale(1.2);
                    opacity: 0;
                }
            }

            .year-card span {
                position: relative;
                z-index: 1;
                display: grid;
                height: 100%;
                place-items: center;
            }

            .archive-link {
                background: transparent;
                color: #fff;
            }

            .archive-link::before {
                background: #fff;
            }

            .archive-link:hover {
                color: #111;
            }

            @media (max-width: 700px) {
                .container {
                    padding: 48px 0;
                }

                .year-card {
                    display: flex;
                    width: 100%;
                    height: 120px;
                    margin: 8px 0;
                }

                .year-card span {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <p class="eyebrow">Selected work · 2023—2026</p>
            <h1>Alex Gonzalez<br>Portfolio</h1>
            <p class="intro">Filmmaker, creative technologist, and educator. A record of selected projects across film, web, interactive media, and teaching.</p>
            <a href="2025-2026portfolio/index.html" class="year-card">
                <span>2026</span>
            </a>
            <a href="../share/index.html" class="year-card archive-link">
                <span>2024-2025</span>
            </a>
            <a href="src/portfolio.html" class="year-card">
                <span>2023 and Before</span>
            </a>
        </div>
    </body>
</html>
