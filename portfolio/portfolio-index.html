<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Index</title>
        <link rel="stylesheet" href="index-style.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&display=swap"
            rel="stylesheet">
        <style>
            body {
                font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                background-color: #0c0e10;
                color: #fff;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                position: relative;
            }

            .ecm-bg-layer {
                position: fixed;
                inset: 0;
                z-index: 0;
                background-position: center;
                background-size: cover;
                background-repeat: no-repeat;
                filter: contrast(1.12);
                transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .ecm-grain-overlay {
                position: fixed;
                inset: 0;
                z-index: 1;
                opacity: 0.28;
                pointer-events: none;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 170 170' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
                mix-blend-mode: soft-light;
            }

            .container {
                position: relative;
                z-index: 2;
                width: min(1120px, calc(100% - 64px));
                padding: 84px 0;
            }

            h1 {
                font-size: clamp(2.8rem, 7vw, 6.5rem);
                line-height: .9;
                letter-spacing: -.07em;
                margin: 0;
            }

            .intro {
                max-width: 560px;
                color: #bdbdbd;
                font-size: 1.05rem;
                line-height: 1.6;
                margin: 24px 0 64px;
            }

            .eyebrow {
                color: #8f8f8f;
                font-size: .75rem;
                font-weight: 700;
                letter-spacing: .16em;
                margin: 0 0 18px;
                text-transform: uppercase;
            }

            .year-card {
                position: relative;
                display: inline-block;
                width: 300px;
                height: 200px;
                margin: 8px;
                background-color: #fff;
                border: 1px solid rgba(255, 255, 255, 0.9);
                border-radius: 0;
                box-shadow: none;
                text-decoration: none;
                color: #111;
                font-size: 1.45em;
                font-weight: 700;
                line-height: normal;
                vertical-align: middle;
                overflow: hidden;
                transition: background-color 0.2s, color 0.2s, transform 0.2s;
            }

            .year-card::before {
                content: '';
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #111;
                transition: top 0.25s ease;
                z-index: 0;
            }

            .year-card:hover::before {
                top: 0;
            }

            .year-card:hover {
                color: #fff;
                transform: translateY(-4px);
            }

            .year-card:active {
                animation: explode 0.3s forwards;
            }

            @keyframes explode {
                0% {
                    transform: scale(1);
                }
                100% {
                    transform: scale(1.2);
                    opacity: 0;
                }
            }

            .year-card span {
                position: relative;
                z-index: 1;
                display: grid;
                height: 100%;
                place-items: center;
            }

            .archive-link {
                background: transparent;
                color: #fff;
            }

            .archive-link::before {
                background: #fff;
            }

            .archive-link:hover {
                color: #111;
            }

            @media (max-width: 700px) {
                .container {
                    padding: 48px 0;
                }

                .year-card {
                    display: flex;
                    width: 100%;
                    height: 120px;
                    margin: 8px 0;
                }

                .year-card span {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div id="ecm-bg" class="ecm-bg-layer" aria-hidden="true"></div>
        <div class="ecm-grain-overlay" aria-hidden="true"></div>
        <div class="container">
            <p class="eyebrow">Selected work · 2023—2026</p>
            <h1>Alex Gonzalez<br>Portfolio</h1>
            <p class="intro">Filmmaker, creative technologist, and educator. A record of selected projects across film, web, interactive media, and teaching.</p>
            <a href="2025-2026portfolio/index.html" class="year-card">
                <span>2026</span>
            </a>
            <a href="../share/index.html" class="year-card archive-link">
                <span>2024-2025</span>
            </a>
            <a href="src/portfolio.html" class="year-card">
                <span>2023 and Before</span>
            </a>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const backgroundImages = [
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-01-desk-rig.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-02-marsh-road.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-03-tripod-field.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-04-crew-pizza.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-06-field-walk.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-07-attic-rafters.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-08-interior-camera.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-09-woods-thumbsup.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/citg-bts-10-field-trail.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/ecm-koffee-01-interior.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/ecm-koffee-02-counter.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/ecm-koffee-03-espresso.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/ecm-koffee-04-cup.jpg',
                    './2025-2026portfolio/portfolio-content/creatures-bts/ecm-koffee-05-sticker.jpg'
                ];

                let currentIndex = Math.floor(Math.random() * backgroundImages.length);
                const bgEl = document.getElementById('ecm-bg');

                const applyBg = (index) => {
                    const imgUrl = backgroundImages[index];
                    if (bgEl) {
                        bgEl.style.backgroundImage = `linear-gradient(180deg, rgba(8, 10, 12, 0.74) 0%, rgba(8, 10, 12, 0.88) 100%), url('${imgUrl}')`;
                    }
                };

                applyBg(currentIndex);

                if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && backgroundImages.length > 1) {
                    setInterval(function () {
                        currentIndex = (currentIndex + 1) % backgroundImages.length;
                        applyBg(currentIndex);
                    }, 9000);
                }
            });
        </script>
    </body>
</html>
