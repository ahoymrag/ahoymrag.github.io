<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio Index</title>
        <link rel="stylesheet" href="index-style.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&display=swap"
            rel="stylesheet">
        <style>
            body {
                font-family: 'Barlow', sans-serif;
                background-color: #f0f0f0;
                color: #333;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .container {
                text-align: center;
            }

            h1 {
                font-size: 3em;
                margin-bottom: 20px;
            }

            .year-card {
                position: relative;
                display: inline-block;
                width: 300px;
                height: 200px;
                margin: 20px;
                background-color: #fff;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                text-decoration: none;
                color: #333;
                font-size: 1.5em;
                line-height: 200px;
                vertical-align: middle;
                overflow: hidden;
                transition: box-shadow 0.3s;
            }

            .year-card::before {
                content: '';
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.1);
                transition: top 0.5s ease;
                z-index: 0;
            }

            .year-card:hover::before {
                top: 0;
            }

            .year-card:active {
                animation: explode 0.3s forwards;
            }

            @keyframes explode {
                0% {
                    transform: scale(1);
                }
                100% {
                    transform: scale(1.2);
                    opacity: 0;
                }
            }

            .year-card span {
                position: relative;
                z-index: 1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <a href="2024portfolio/index.html" class="year-card">
                <span>2024</span>
            </a>
            <a href="src/portfolio.html" class="year-card">
                <span>2023 and Before</span>
            </a>
        </div>
    </body>
</html>
