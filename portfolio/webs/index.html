<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
        <title>Alex Gonzalez | Website Portfolio</title>
        <link rel="icon" type="image/png" href="/path/to/favicon.png">
        <link rel="stylesheet" href="./ag-webs.css">

    </head>

    <body>
        <nav class="home-button-wrap">
            <a class="home-button-link" href="/index.html">Home</a>
            <a class="home-button-link" href="./portfolio.html">Professional
                Portfolio</a>
        </nav>

        <header>
            <div class="header-main-wrap">
                <div class="header-content-wrap">
                    <div class="header-content-title-wrap">
                        <h1>Website Portfolio</h1>
                        <p>A collection of my web development projects</p>
                    </div>
                </div>
            </div>
        </header>

        <main id="website-grid">
            <!-- Website items will be dynamically inserted here -->
        </main>

        <div id="popup" class="popup">
            <div class="popup-content">
                <span class="close">&times;</span>
                <h2 id="popup-title"></h2>
                <p id="popup-description"></p>
                <div id="popup-gallery"></div>
                <p>Year: <span id="popup-year"></span></p>
                <p>Month: <span id="popup-month"></span></p>
                <p>Professional: <span id="popup-professional"></span></p>
                <p>For Client: <span id="popup-client"></span></p>
                <p>Client Name: <span id="popup-client-name"></span></p>
                <a id="popup-link" href="#" target="_blank">Visit Website</a>
            </div>
        </div>

        <script src="ag-webs.js"></script>
    </body>
</html>
