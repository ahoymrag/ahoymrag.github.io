<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CRM Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Simple CRM Dashboard</h2>
        <p>Below is an embedded Google Sheet tracking invoices and retainers.</p>
        <iframe src="https://docs.google.com/spreadsheets/d/1_aXAOcb_PB7veuX4IZtCiSsLeGknN9TJPijQYLZFoJ4/pubhtml?widget=true&headers=false"></iframe>
    </div>
</body>
</html>
