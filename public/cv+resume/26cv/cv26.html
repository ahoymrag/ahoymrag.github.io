<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Gonzalez — CV 2026</title>
  <meta name="description" content="CV for Alex Gonzalez — Creative Director, Filmmaker, Software Designer." />
  <meta name="author" content="Alex Gonzalez" />
  <link rel="icon" type="image/png" href="../../src/assets/AlexGonzalez-favicon.png" />
  <link rel="stylesheet" href="./cv26.css" />
</head>
<body>

  <div class="no-print">
    <button onclick="window.print()">Print / Save as PDF</button>
    <a href="/public/cv+resume/cv-index.html">← All CVs</a>
    <a href="/">Home</a>
  </div>

  <div id="resume" class="container"></div>

  <div class="no-print" style="margin-bottom:2rem;">
    <a href="/public/cv+resume/cv-index.html">← All CVs</a>
    <a href="/">Home</a>
  </div>

  <script>
    fetch("./cv26.json")
      .then(r => r.json())
      .then(cv => {
        const el = document.getElementById("resume");

        // Header
        el.innerHTML += `
          <div class="cv-header">
            <h1>${cv.name}</h1>
            <div class="cv-title">${cv.title}</div>
            <div class="cv-contact">
              <span>${cv.contact.phone}</span>
              <span>${cv.contact.email}</span>
              <span>${cv.contact.portfolio}</span>
            </div>
          </div>`;

        // Summary
        el.innerHTML += `
          <div class="section">
            <h2>Professional Summary</h2>
            <p>${cv.professional_summary}</p>
          </div>`;

        // Work Experience
        const workHTML = cv.work_experience.map(job => `
          <div class="entry">
            <div class="entry-header">
              <div>
                <span class="entry-title">${job.title}</span>
                <span class="entry-company"> — ${job.company}</span>
              </div>
              <span class="entry-date">${job.years || job.year || ''}</span>
            </div>
            ${job.description ? `<div class="entry-desc">${job.description}</div>` : ''}
          </div>`).join('');
        el.innerHTML += `<div class="section"><h2>Work Experience</h2>${workHTML}</div>`;

        // Teaching Experience
        const teachHTML = cv.teaching_experience.map(t => `
          <div class="entry">
            <div class="entry-header">
              <span class="entry-title">${t.institution}</span>
              <span class="entry-date">${t.years || t.year || ''}</span>
            </div>
            <div class="entry-desc">${t.courses_taught.join(', ')}</div>
          </div>`).join('');
        el.innerHTML += `<div class="section"><h2>Teaching Experience</h2>${teachHTML}</div>`;

        // Recent Projects
        if (cv.recent_projects && cv.recent_projects.filmmaking) {
          const projHTML = cv.recent_projects.filmmaking.map(p => `
            <li><span style="font-weight:600">${p.title}</span> — ${p.project}${p.company ? ` (${p.company})` : ''}</li>`
          ).join('');
          el.innerHTML += `<div class="section"><h2>Recent Projects</h2><ul>${projHTML}</ul></div>`;
        }

        // Skills
        const skillsHTML = cv.skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
        el.innerHTML += `<div class="section"><h2>Skills</h2><div class="skills-list">${skillsHTML}</div></div>`;

        // Achievements
        const achHTML = cv.achievements.map(a => `<li>${a}</li>`).join('');
        el.innerHTML += `<div class="section"><h2>Achievements</h2><ul>${achHTML}</ul></div>`;
      });
  </script>
</body>
</html>
