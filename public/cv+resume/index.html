<!DOCTYPE html>
<html>
  <head>
    <title>Alex Gonzalez's Resume</title>
    <link rel="stylesheet" href="./ag-cv.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="container" id="resumeContainer">
      <!-- Resume content will be inserted here by JavaScript -->
    </div>
    <!-- Add a print button -->
    <button class="print-button" onclick="window.print()">Print as PDF</button>
    <script>
      // Fetch the JSON data from the file
      fetch("./alexresume23.json")
        .then((response) => response.json())
        .then((data) => populateResume(data))
        .catch((error) => console.error("Error:", error));

      // Function to populate resume content into HTML
      function populateResume(resumeContent) {
        const resumeContainer = document.getElementById("resumeContainer");
        for (const [section, content] of Object.entries(resumeContent)) {
          const sectionElement = document.createElement("div");
          sectionElement.classList.add("resume-section");

          const titleElement = document.createElement("h2");
          titleElement.innerText = section;
          sectionElement.appendChild(titleElement);

          if (typeof content === "object") {
            for (const [subSection, subContent] of Object.entries(content)) {
              const subSectionElement = document.createElement("h3");
              subSectionElement.innerText = subSection;
              sectionElement.appendChild(subSectionElement);

              const subContentElement = document.createElement("p");
              subContentElement.innerText = subContent;
              sectionElement.appendChild(subContentElement);
            }
          } else {
            const contentElement = document.createElement("p");
            contentElement.innerText = content;
            sectionElement.appendChild(contentElement);
          }

          resumeContainer.appendChild(sectionElement);
        }
      }
    </script>
  </body>
</html>
