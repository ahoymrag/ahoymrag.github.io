<!DOCTYPE html>
<html>
  <head>
    <title>Alex Gonzalez Resume</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      .section {
        margin-bottom: 20px;
      }
      .section h2 {
        color: #333;
      }
      .section ul {
        list-style-type: none;
      }
      .section ul li {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="resume"></div>

    <script>
      fetch("./alexresume23.json")
        .then((response) => response.json())
        .then((resume) => {
          var resumeDiv = document.getElementById("resume");

          // Name and title
          resumeDiv.innerHTML += `<h1>${resume.name}</h1>`;
          resumeDiv.innerHTML += `<h2>${resume.title}</h2>`;

          // Contact
          resumeDiv.innerHTML += `<div class="section">
                    <h2>Contact</h2>
                    <ul>
                        <li>Phone: ${resume.contact.phone}</li>
                        <li>Email: ${resume.contact.email}</li>
                        <li>Portfolio: ${resume.contact.portfolio}</li>
                    </ul>
                </div>`;

          // Professional Summary
          resumeDiv.innerHTML += `<div class="section">
                    <h2>Professional Summary</h2>
                    <p>${resume.professional_summary}</p>
                </div>`;

          // Work Experience
          var workExperienceHTML = resume.work_experience
            .map(
              (job) =>
                `<li>${job.title} at ${job.company} (${job.year}): ${job.description}</li>`
            )
            .join("");
          resumeDiv.innerHTML += `<div class="section">
                    <h2>Work Experience</h2>
                    <ul>${workExperienceHTML}</ul>
                </div>`;

          // ... repeat for other sections ...
        });
    </script>
  </body>
</html>
