    /* Use a smaller base font to help fit content on one PDF page */
    @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap");

    }
    .container {
      border: 1px solid #ddd;
      padding: 16px; /* smaller padding to save space */
      background: #fff;
      max-width: 8.5in;
      margin: auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 24px; /* smaller main heading */
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.2;
      color: black;
    }
    h2 {
      font-size: 16px; /* smaller sub-headings */

      color: #000000;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    .bio-subheader {
      line-height: 1.2;
      font-size: 18px; /* smaller secondary heading */
      text-align: left;
      font-weight: 400;
      margin-bottom: 10px;
    }
    .section {

    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    ul li {
      margin-bottom: 4px;
      padding-left: 16px;
      position: relative;
    }
    ul li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #bbb;
    }
    .position,
    .company,
    .year,
    .degree,
    .major,
    .school,
    .graduation-date,
    .title,
    .institution,
    .role,
    .project {

    #print {
      background-color: black;
      color: #ffffff;
      padding: 8px 16px;
      font-size: 14px;
      border-style: solid;
      border-color: black;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.3s ease;
    }
    #print:hover {
      background-color: #ffffff;
      color: black;
    }
    @media print {
      body,
      .container {
        box-shadow: none;
      }
      #print {
        display: none;
      }
      .home-button-link {
        display: none;
      }
    }
    .home-button-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: rgba(127, 28, 28, 0);
    }
    .home-button-link {
      font-family: "Open Sans";
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffffeb;
      width: 100px;
      height: 36px;
      text-align: center;
      text-transform: uppercase;
      text-decoration: none;
      color: #333;
      margin-top: 8px;
    }
    .home-button-link:hover {
      color: #ff0060;
    }
  </style>

        <!-- Main JS that builds the resume dynamically -->
        <script>
    // Populate resume
    (function () {
      var resume = resumeData; // data from the inline JSON
      var resumeDiv = document.getElementById("resume");

      // Name and title
      resumeDiv.innerHTML += `<h1>${resume.name}</h1>`;
      resumeDiv.innerHTML += `<h2 class="bio-subheader">${resume.title}</h2>`;

      // Contact
      resumeDiv.innerHTML += `
        <div class="section">
          <h2>Contact</h2>
          <ul>
            <li>Phone: ${resume.contact.phone}</li>
            <li>Email: ${resume.contact.email}</li>
            <li>Portfolio: ${resume.contact.portfolio}</li>
          </ul>
        </div>`;

      // Professional Summary
      resumeDiv.innerHTML += `
        <div class="section">
          <h2>Professional Summary</h2>
          <p>${resume.professional_summary}</p>
        </div>`;

      // Work Experience
      if (resume.work_experience) {
        let workHTML = resume.work_experience.map((job) => {
          const yearString = job.year ? job.year : (job.years || "");
          const description = job.description ? `: ${job.description}` : "";
          return `
            <li>
              <span class="position">${job.title}</span> at 
              <span class="company">${job.company}</span> 
              (<span class="year">${yearString}</span>)${description}
            </li>`;
        }).join("");

        resumeDiv.innerHTML += `
          <div class="section">
            <h2>Work Experience</h2>
            <ul>${workHTML}</ul>
          </div>`;
      }

      // Education (remove if your data doesn't have it)
      if (resume.education) {
        let eduHTML = resume.education.map((edu) =>
          `<li>
            <span class="degree">${edu.degree}</span> in 
            <span class="major">${edu.major}</span> from 
            <span class="school">${edu.school}</span> 
            (Graduated: <span class="graduation-date">${edu.graduation_date}</span>)
          </li>`
        ).join("");

        resumeDiv.innerHTML += `
          <div class="section">
            <h2>Education</h2>
            <ul>${eduHTML}</ul>
          </div>`;
      }

      // Teaching Experience
      if (resume.teaching_experience) {
        let teachHTML = resume.teaching_experience.map((teach) => {
          const time = teach.year ? teach.year : (teach.years || "");
          const location = teach.location ? `, ${teach.location}` : "";
          const courses = teach.courses_taught.join(", ");
          // Some items might not have 'title', so we use (teach.title || '') safely.
          return `
            <li>
              <span class="title">${teach.title || ""}</span> at 
              <span class="institution">${teach.institution}</span>
              ${location} (${time}). Courses Taught: ${courses}
            </li>`;
        }).join("");

        resumeDiv.innerHTML += `
          <div class="section">
            <h2>Teaching Experience</h2>
            <ul>${teachHTML}</ul>
          </div>`;
      }

      // Recent Projects (Filmmaking, etc.) 
      if (resume.recent_projects && resume.recent_projects.filmmaking) {
        const filmProjects = resume.recent_projects.filmmaking.map((proj) => {
          const company = proj.company ? `, ${proj.company}` : "";
          return `
            <li>
              <span class="title">${proj.title}</span> 
              for <span class="project">${proj.project}</span>${company}
            </li>`;
        }).join("");

        resumeDiv.innerHTML += `
          <div class="section">
            <h2>Recent Filmmaking Projects</h2>
            <ul>${filmProjects}</ul>
          </div>`;
      }

      // Skills
      if (resume.skills) {
        let skillsHTML = resume.skills.map((skill) => `<li>${skill}</li>`).join("");
        resumeDiv.innerHTML += `
          <div class="section">
            <h2>Skills</h2>
            <ul>${skillsHTML}</ul>
          </div>`;
      }

      // Achievements
      if (resume.achievements) {
        let achieveHTML = resume.achievements.map((ach) => `<li>${ach}</li>`).join("");
        resumeDiv.innerHTML += `
          <div class="section">
            <h2>Achievements</h2>
            <ul>${achieveHTML}</ul>
          </div>`;
      }

      // References
      if (resume.references) {
        let refsHTML = resume.references.map((ref) =>
          `<li>${ref.name}, ${ref.title} at ${ref.company}</li>`
        ).join("");
        resumeDiv.innerHTML += `
          <div class="section">
            <h2>References</h2>
            <ul>${refsHTML}</ul>
          </div>`;
      }

      // If there's a cover_letter property with a 'letter' text, show it:
      if (resume.cover_letter && resume.cover_letter.letter) {
        const coverLetter = resume.cover_letter.letter.replace(/\n/g, "<br />");
        resumeDiv.innerHTML += `
          <div class="section">
            <h2>Cover Letter</h2>
            <p>${coverLetter}</p>
          </div>`;
      }
    })();

    // Print to PDF handler
    document.getElementById("print").addEventListener("click", function () {
      // We'll create a new jsPDF instance with 'pt' units and 'letter' size for 8.5"x11"
      var doc = new jsPDF('p', 'pt', 'letter');

      // Grab the HTML from the resume container
      var source = document.getElementById("resume");

      // We'll use fromHTML (older jsPDF method) to place the content in the PDF.
      // We'll pass a smaller 'width' so it fits the PDF margins without overflow.
      doc.fromHTML(
        source,
        40, // x coord
        40, // y coord
        {
          'width': 532 // ~7.4 inches (letter is 612pt wide minus ~80pt for margins)
        },
        function() {
          doc.save("Alex Gonzalez - Resume.pdf");
        }
      );
    });
  </script>
