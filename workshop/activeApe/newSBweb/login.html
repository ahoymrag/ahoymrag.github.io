<html>
    <head>
        <title>Login - Silverback</title>
        <meta name="description"
            content="Log in to access the Silverback CLI and web app.">
        <meta name="keywords"
            content="Silverback, login, CLI, web3 bots, ApeWorX">
        <meta name="author" content="ApeWorX">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#1F1E33;">
        <link rel="stylesheet" href="../desGuide/css/elementals.css">
        <link rel="stylesheet" href="silverback-product-website.css">
        <link rel="preload"
            href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;900&display=swap"
            as="style" onload="this.rel='stylesheet'">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    </head>
    <body class="sb-web">
        <nav>
            <img src="./assets/Silverback Logo.png" alt="Logo">
            <div class="nav-links">
                <a href="index.html" class="join-button">Home</a>
            </div>
        </nav>
        <div id="main-page-content" class="content-wrapper">
            <section id="login" class="hero">
                <h1>Log In</h1>
                <p>Access your Silverback account to manage your web3 bots.</p>

                <form class="basic-form">
                    <h2>Log In to Your Account</h2>
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Enter your password">
                    <br>
                    <button type="submit">Log In</button>
                </form>
                <p>Don't have an account? <a href="join-cli-beta.html">Create
                        one</a></p>
            </section>
        </div>
        <footer>
            <img src="https://apeworx.io/assets/apeFull.png" alt="ApeWorX Logo">
            <nav class="social-icons">
                <a href="#"><i class="fab fa-discord"
                        aria-hidden="true"></i><span
                        class="sr-only">Discord</span></a>
                <a href="https://github.com/ApeWorX/silverback"><i
                        class="fab fa-github" aria-hidden="true"></i><span
                        class="sr-only">GitHub</span></a>
                <a href="#"><i class="fab fa-telegram"
                        aria-hidden="true"></i><span
                        class="sr-only">Telegram</span></a>
                <a href="#"><i class="fab fa-x-twitter"
                        aria-hidden="true"></i><span
                        class="sr-only">X</span></a>
            </nav>
            <p>Copyright © 2024 ApeWorX | All Rights Reserved</p>
        </footer>
    </body>
</html>
