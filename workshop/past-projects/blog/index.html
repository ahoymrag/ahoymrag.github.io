<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Blog</title>
		<link rel="stylesheet" href="blog.css">
	</head>
	<body>
		<div class="blog">
			<div class="blog-part is-menu" id="sidebar">
				<!-- Menu items will be inserted here by JavaScript -->
			</div>
			<div id="main-content">
				<div class="blog-header blog-is-sticky">
					<div class="blog-article header-article">
						<div class="blog-big__title">Self</div>
						<div class="blog-menu rounded small-title">Pinned Issue</div>
					</div>
					<div class="blog-article page-number">
						NO. 01
					</div>
				</div>
				<div class="blog-header-container" id="featured-articles">
					<!-- Featured articles will be inserted here by JavaScript -->
				</div>
				<div class="blog-part right-blog" id="featured-thoughts">
					<marquee width="100%" direction="left">
						<!-- Right blog items will be inserted here by JavaScript -->
					</marquee>
					<div class="blog-right-title-container">
						<div class="blog-right-title">
							Featured Thoughts
						</div>
						<div class="blog-menu rounded">See All</div>
					</div>
					<div class="blog-right">
						<!-- Featured articles on the right will be inserted here by JavaScript -->
						<div class="circle">
							<div class="circle-title">Leave Your Old Life Behind</div>
							<div class="circle-subtitle">Don't try to be like someone else, be
								yourself. Be secure with yourself.</div>
							<div class="circle-footer">Explore</div>
						</div>
					</div>
				</div>
				<div class="blog-part movie-reviews-section" id="movie-reviews">
					<div class="blog-right-title-container">
						<div class="blog-right-title">
							Movie Reviews
						</div>
						<div class="blog-menu rounded">See All</div>
					</div>
					<div class="movie-reviews">
						<!-- Movie reviews will be inserted here by JavaScript -->
					</div>
				</div>
			</div>
		</div>
		<script src="blog.js"></script>
	</body>
</html>
