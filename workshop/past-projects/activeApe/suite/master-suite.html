<html>
    <head>
        <title>ApeWorx Master Suite</title>
        <link rel="stylesheet" href="../desGuide/css/elementals.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            .product-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-decoration: none;
                color: white;
                transition: transform 0.3s ease;
            }
            .product-card:hover {
                transform: scale(1.05);
            }
            .product-card i {
                font-size: 3rem;
                margin-bottom: 10px;
            }
        </style>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            :root {
                --mastersuite-gradient-color-1: #001f3f;
                --mastersuite-gradient-color-2: #250000;
                --mastersuite-gradient-color-3: #002e66;
                --mastersuite-gradient-color-4: #003366;
                --mastersuite-gradient-color-5: #001f3f;
                --mastersuite-ripple-duration: 15s;
            }
            
            .body-masterSuite {
                color: white;
                background: radial-gradient(
                    circle at center,
                    var(--mastersuite-gradient-color-1) 0%,
                    var(--mastersuite-gradient-color-2) 25%,
                    var(--mastersuite-gradient-color-3) 50%,
                    var(--mastersuite-gradient-color-4) 75%,
                    var(--mastersuite-gradient-color-5) 100%
                );
                background-size: 200% 200%;
                animation: rippleAnimation var(--mastersuite-ripple-duration) ease-in-out infinite;
                font-family: 'Barlow', sans-serif;
            }
        </style>
    </head>
    <body class="body-masterSuite">
        <header class="center">
            <a href="../desGuide/elementals/elementals-b3.html">
                <img src="Apeworx_Icon_Grey-S.png"
                    alt="ApeWorx Icon"
                    class="small-logo">
            </a>
            <div class="time-display" id="clock"></div>
            <div class="temp-display" id="temp"></div>
        </header>

        <section class="layout-grid columns-3">
            <article>
                <a href="p-apeframe.html" class="product-card">
                    <img src="https://apeworx.io/framework/frame.png"
                        alt="ApeFramework Icon">
                    <h3>apeFramework</h3>
                    <p>Build dApps with ease</p>
                </a>
            </article>
            <article>
                <a href="product-silverback.html" class="product-card">
                    <img src="https://apeworx.io/silverback/silverback-grey.png"
                        alt="Silverback Icon">
                    <h3>Silverback</h3>
                    <p>Develop bots that listen and respond to live chain
                        data</p>
                </a>
            </article>
            <article>
                <a href="product-apepay.html" class="product-card">
                    <img src="path/to/apepay-icon.png" alt="ApePay Icon">
                    <h3>ApePay</h3>
                    <p>Fast crypto payments</p>
                </a>
            </article>
            <article>
                <a href="product-chaosnet.html" class="product-card">
                    <img src="path/to/chaosnet-icon.png" alt="Chaosnet Icon">
                    <h3>cHaOSneT</h3>
                    <p>Decentralized network</p>
                </a>
            </article>
            <article>
                <a href="product-academy.html" class="product-card">
                    <img src="path/to/academy-icon.png" alt="Ape Academy Icon">
                    <h3>Ape Academy</h3>
                    <p>Learn blockchain dev</p>
                </a>
            </article>
            <article>
                <a href="https://docs.apeworx.io" class="product-card">
                    <img src="path/to/apedocs-icon.png" alt="ApeDocs Icon">
                    <h3>ApeDocs</h3>
                    <p>Comprehensive documentation</p>
                </a>
            </article>
        </section>
        <footer>
            <p>ApeWorx Master Suite</p>
            <em>v0.2.0</em>
        </footer>
        <portal>
            <button>

                <details class="vertical-menu">
                    <summary><i class="fas fa-th"></i></summary>
                    <a href="#">apeworx.io</a>
                    <a href="#">docs.apeworx.io</a>
                    <a href="#">academy.apeworx.io</a>
                    <a href="#">Switch Profile</a>
                </details>
            </button>
        </portal>

        <object>

            <details>
                <summary>User Profile Name</summary>
                <a href="#">Manage Account</a>
                <a href="#">Settings</a>
                <a href="#">Sign Out</a>
                <a href="#">Switch Profile</a>
            </details>
            <a href="#" onclick="toggleMinimize()">
                <img src="#" alt="Profile Picture">
            </a>
        </object>
        <script>
            function updateClock() {
                const now = new Date();
                const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.getElementById('clock').textContent = time;
            }
            setInterval(updateClock, 1000);
            updateClock();
        </script>
    </body>
</html>
